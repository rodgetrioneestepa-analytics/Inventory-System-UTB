# Review the paid server and persistent-disk cost before applying this Blueprint.
# This creates a new service; it does not import or replace the local database.
services:
  - type: web
    name: utb-inventory-api
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: node dist/server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/utb.sqlite
      - key: APP_ORIGIN
        sync: false
    disk:
      name: utb-inventory-data
      mountPath: /var/data
      sizeGB: 1
